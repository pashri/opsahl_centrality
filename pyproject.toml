[project]
name = "opsahl-centrality"
version = "1.0.0"
description = "Tore Opsahl's closeness centrality algorithm for NetworkX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
    { name = "Patrick Linton", email = "patrickdaniellinton@gmail.com" },
]
keywords = [
    "networkx",
    "graph",
    "network-analysis",
    "centrality",
    "closeness-centrality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "networkx>=2.3",
]

[project.urls]
Homepage = "https://github.com/pashri/opsahl_centrality"
Repository = "https://github.com/pashri/opsahl_centrality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsahl_centrality"]

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    { include-group = "test" },
    "pylint>=3.0",
    "mypy>=1.0",
    "isort>=5.0",
    "numpydoc>=1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opsahl_centrality --cov-report=term-missing"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 79
src_paths = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "networkx.*"
ignore_missing_imports = true

[tool.pylint.format]
max-line-length = 79

[tool.pylint.basic]
good-names = ["G", "u", "n"]

[tool.pylint.design]
max-statements = 6

[tool.numpydoc_validation]
# "all" enables every check; the rest are exclusions.
# GL01 wants the summary below the quotes, contradicting PEP 257.
checks = ["all", "ES01", "EX01", "SA01", "GL08", "GL01"]
exclude = ["^test_", "\\.__init__$"]
